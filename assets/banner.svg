<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <!-- Title Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Animated Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.05"/>
    </pattern>

    <!-- Drop Shadow Filter for Text Contrast -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style>
    .grid-bg { animation: moveGrid 20s linear infinite; }
    .pulse-circle { animation: pulse 4s ease-in-out infinite alternate; }
    .float-node { animation: float 6s ease-in-out infinite alternate; }
    .title-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 56px; fill: url(#textGrad); }
    .subtitle-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 22px; fill: #e2e8f0; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.3; }
      100% { transform: scale(1.15); opacity: 0.6; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-15px); }
    }
  </style>

  <!-- Solid Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  
  <!-- Grid overlay -->
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Dynamic background glowing circles (behind text) -->
  <g opacity="0.4">
    <circle cx="200" cy="100" r="180" fill="#6366f1" filter="blur(60px)" class="pulse-circle"/>
    <circle cx="1000" cy="300" r="220" fill="#a855f7" filter="blur(80px)" class="pulse-circle"/>
    <circle cx="600" cy="200" r="150" fill="#06b6d4" filter="blur(70px)" class="pulse-circle"/>
  </g>

  <!-- Dynamic Browser Node Graphics (positioned on sides so center text is crisp) -->
  <g class="float-node" opacity="0.25">
    <!-- Left Browser Frame Graphic -->
    <rect x="70" y="80" width="220" height="150" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="90" cy="98" r="4" fill="#ef4444"/>
    <circle cx="102" cy="98" r="4" fill="#f59e0b"/>
    <circle cx="114" cy="98" r="4" fill="#10b981"/>
    <rect x="130" y="92" width="145" height="12" rx="6" fill="#334155"/>
    <path d="M90 125 L180 125 M90 145 L250 145 M90 165 L210 165 M90 185 L160 185" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g class="float-node" style="animation-delay: -3s;" opacity="0.25">
    <!-- Right AI Agent Node Graphic -->
    <rect x="910" y="170" width="220" height="150" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
    <circle cx="930" cy="188" r="4" fill="#ef4444"/>
    <circle cx="942" cy="188" r="4" fill="#f59e0b"/>
    <circle cx="954" cy="188" r="4" fill="#10b981"/>
    <rect x="970" y="182" width="145" height="12" rx="6" fill="#334155"/>
    <circle cx="1020" cy="245" r="25" fill="none" stroke="#a855f7" stroke-width="3"/>
    <path d="M1005 245 L1035 245 M1020 230 L1020 260" stroke="#a855f7" stroke-width="3"/>
  </g>

  <!-- Connecting Dynamic Data Lines -->
  <path d="M 290 155 Q 450 80 600 80 T 910 245" fill="none" stroke="url(#glowGrad)" stroke-width="2" stroke-dasharray="8,8" opacity="0.4"/>

  <!-- Foreground Content Container (Ensures 100% visibility) -->
  <g text-anchor="middle" filter="url(#shadow)">
    <!-- Pill Badge -->
    <rect x="440" y="65" width="320" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
    <text x="600" y="86" class="badge-text" text-anchor="middle">⚡ CURATED ECOSYSTEM 2026</text>

    <!-- Main Title -->
    <text x="600" y="165" class="title-text">Awesome AI Browser Automation</text>

    <!-- Subtitle -->
    <text x="600" y="215" class="subtitle-text">Cloud Browsers • AI Web Agents • Playwright &amp; Puppeteer Infrastructure</text>

    <!-- Key Tags Line -->
    <g transform="translate(600, 275)" font-family="'Segoe UI', sans-serif" font-size="14" fill="#94a3b8">
      <rect x="-310" y="-18" width="130" height="30" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="-245" y="2" text-anchor="middle" fill="#cbd5e1">🌐 Headless APIs</text>

      <rect x="-160" y="-18" width="140" height="30" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="-90" y="2" text-anchor="middle" fill="#cbd5e1">🤖 Computer-Use</text>

      <rect x="-0" y="-18" width="150" height="30" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="75" y="2" text-anchor="middle" fill="#cbd5e1">🎭 Playwright MCP</text>

      <rect x="170" y="-18" width="140" height="30" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="240" y="2" text-anchor="middle" fill="#cbd5e1">🕷️ Web Scraping</text>
    </g>
  </g>
</svg>
